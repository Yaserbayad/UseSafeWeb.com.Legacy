name: Website production TLS read-only discovery 20260908

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website-production-tls-readonly-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls_discovery:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Verify runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true

      - name: Discover certificate and nginx bindings without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'TLS_DISCOVERY_MODE=READ_ONLY'
          echo 'CERTIFICATE_DIRECTORIES_BEGIN'
          if sudo -n test -d /etc/letsencrypt/live; then
            sudo -n find /etc/letsencrypt/live -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort
          fi
          echo 'CERTIFICATE_DIRECTORIES_END'

          echo 'CERTIFICATE_SANS_BEGIN'
          if sudo -n test -d /etc/letsencrypt/live; then
            while IFS= read -r cert; do
              [[ -f "$cert" ]] || continue
              printf 'CERT=%s\n' "$cert"
              sudo -n openssl x509 -in "$cert" -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || true
            done < <(sudo -n find -L /etc/letsencrypt/live -mindepth 2 -maxdepth 2 -name fullchain.pem -type f | LC_ALL=C sort)
          fi
          echo 'CERTIFICATE_SANS_END'

          echo 'NGINX_TLS_BINDINGS_BEGIN'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          sudo -n nginx -T >"$tmp" 2>&1
          grep -E '^[[:space:]]*(server_name|ssl_certificate|ssl_certificate_key)[[:space:]]' "$tmp" || true
          echo 'NGINX_TLS_BINDINGS_END'
          echo 'TLS_DISCOVERY=PASS'
