name: recovery-stability-20260908-v2
on:
  push:
    branches:
      - recovery/stability-20260908
    paths:
      - .github/workflows/recovery-stability-20260908-v2.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile canonical metadata and validate preserved runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='96681c6173f2afb1b28da5fba15c682144c17ce8'
          git merge-base --is-ancestor "$BASE" HEAD
          printf '%s\n' '.github/workflows/recovery-stability-20260908-v2.yml' '.github/workflows/recovery-stability-20260908.yml' | sort > /tmp/expected-preflight-files
          git diff --name-only "$BASE"...HEAD | sort > /tmp/actual-preflight-files
          diff -u /tmp/expected-preflight-files /tmp/actual-preflight-files
          test "$(git rev-parse "$BASE:CURRENT_STATE.md")" = 'ae203f4b55864f6c0163669dcaf853bcf225a546'
          test "$(git rev-parse "$BASE:Plans/Master/MANIFEST.yaml")" = 'da35db0fe16009dfb5ce0e24caab05d6d02c84ed'
          test "$(git rev-parse "$BASE:Plans/Master/WBS/master-wbs.csv")" = '357c5e1be3b455e7efddd329d6a2468e3125b502'

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          manifest = Path('Plans/Master/MANIFEST.yaml')
          text = manifest.read_text(encoding='utf-8')
          assert 'OWNER_ADDITIONAL_V1_DEFERRALS_CR_0015' in text
          start = text.index('post_freeze_change_control:\n')
          end = text.index('\ngenerated_assembly_contract:\n', start)
          old = text[start:end]
          assert 'latest_change: CR-0013' in old
          assert 'previous_change: CR-0012' in old
          new = """post_freeze_change_control:
            latest_change: CR-0015
            previous_change: CR-0014
            date: '2026-09-04'
            status: owner-approved additional Version-1 / controlled Release-1 deferrals applied; no task PASS or material-action authority created
            authority: explicit Project Owner instruction 2026-09-04; DEC-0062/CR-0015; actual law/safety/security/platform/technical reality remains higher authority
            affected_scope:
            - exactly TSK-0630, TSK-0421, TSK-0415, TSK-0416, TSK-0370, TSK-0499 and TSK-0242 sequencing fields (Plan_Status, Trigger, Relative_Timing, Notes)
            - DEC-0062 and CR-0015 change-control metadata
            - generated reconstruction and checksums
            - CURRENT_STATE reconciliation; no dependency edge, ACC/VER/EVD contract, action authority, requirement, interface, risk, gate, milestone or material-action fence change
            semantic_delta: exactly seven owner-selected tasks are deferred until after Version 1 / the controlled Release-1 test with 10-20 people; they remain non-PASS with dependencies and acceptance/evidence contracts preserved; all nonselected tasks remain subject to ordinary dependency semantics
            change_record: Registers/EXCEPTIONS_CHANGE_CONTROLS.md#post-freeze-material-change-records
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          text2 = text[:start] + new.rstrip('\n') + text[end:]
          assert text2.count('post_freeze_change_control:') == 1
          assert 'latest_change: CR-0015' in text2
          assert 'previous_change: CR-0014' in text2
          manifest.write_text(text2, encoding='utf-8')

          sums = Path('Plans/SHA256SUMS.txt')
          out = []
          for line in sums.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              _, rel = line.split('  ', 1)
              p = Path('Plans') / rel
              assert p.is_file(), rel
              out.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          sums.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

          python3 Plans/Master/Tools/validate_master_plan.py | tee /tmp/plan-validation.txt
          grep -qx 'VALIDATION PASS' /tmp/plan-validation.txt
          grep -qx 'tasks=641' /tmp/plan-validation.txt
          grep -qx 'dependency_edges=858' /tmp/plan-validation.txt
          grep -qx 'recurring_hard_predecessors=0' /tmp/plan-validation.txt
          grep -qx 'broken_links=0' /tmp/plan-validation.txt
          grep -qx 'generated_missing_task_ids=0' /tmp/plan-validation.txt

          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/recovery-stability-20260908.yml .github/workflows/recovery-stability-20260908-v2.yml
          printf '%s\n' '.github/workflows/recovery-stability-20260908-v2.yml' '.github/workflows/recovery-stability-20260908.yml' 'Plans/Master/MANIFEST.yaml' 'Plans/SHA256SUMS.txt' | sort > /tmp/expected-plan-files
          git diff --name-only | sort > /tmp/actual-plan-files
          diff -u /tmp/expected-plan-files /tmp/actual-plan-files
          git add Plans/Master/MANIFEST.yaml Plans/SHA256SUMS.txt
          git diff --cached --check
          git commit -m 'recovery: reconcile manifest latest-change metadata'
          PLAN_COMMIT="$(git rev-parse HEAD)"
          MAN_BLOB="$(git hash-object Plans/Master/MANIFEST.yaml)"
          git push origin HEAD:recovery/stability-20260908

          PLAN_COMMIT="$PLAN_COMMIT" MAN_BLOB="$MAN_BLOB" python3 - <<'PY'
          import copy, json, os
          from pathlib import Path

          path = Path('CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          d = json.loads(text)
          assert text == json.dumps(d, indent=2, ensure_ascii=False) + '\n'
          assert d['checkpoint_schema'] == 'serial-light-checkpoint-v1'
          assert d['project_id'] == 'UseSafeWeb.com'
          assert d['governance_mode'] == 'SERIAL_LIGHT'
          assert d['checkpoint_revision'] == 49
          assert d['baseline']['version'] == 1
          assert d['runtime']['project_status'] == 'ACTIVE'
          assert d['runtime']['governance_blocker'] is None
          base = {x['id']: x for x in d['baseline']['work_items']}
          runtime = {x['id']: x for x in d['runtime']['items']}
          assert len(base) == 641 and len(runtime) == 641 and set(base) == set(runtime)
          for x in d['baseline']['work_items']:
              for dep in x.get('depends_on', []):
                  assert dep in base, (x['id'], dep)

          restored = '''TSK-0026 TSK-0027 TSK-0028 TSK-0139 TSK-0165 TSK-0166 TSK-0167 TSK-0168 TSK-0169 TSK-0202 TSK-0207 TSK-0214 TSK-0225 TSK-0227 TSK-0228 TSK-0298 TSK-0302 TSK-0374 TSK-0428 TSK-0429 TSK-0430 TSK-0431 TSK-0437 TSK-0441 TSK-0442 TSK-0443 TSK-0510 TSK-0511 TSK-0512 TSK-0513 TSK-0514 TSK-0559'''.split()
          assert len(restored) == 32
          for tid in restored:
              item = runtime[tid]
              assert item['status'] == 'PASS', tid
              refs = item.get('acceptance_references', [])
              assert refs and any('Historical current PASS is preserved under POL-003' in r.get('summary', '') for r in refs), tid
          assert runtime['TSK-0243']['status'] == 'WAITING'
          assert runtime['TSK-0243'].get('wait', {}).get('resolution_check')

          runtime_before = copy.deepcopy(d['runtime'])
          old = 'Plans/Master/MANIFEST.yaml@20e2763c0be2124378e3158ac559aed826bc6765; blob da35db0fe16009dfb5ce0e24caab05d6d02c84ed'
          new = f"Plans/Master/MANIFEST.yaml@{os.environ['PLAN_COMMIT']}; blob {os.environ['MAN_BLOB']}"
          count = 0
          def walk(v):
              global count
              if isinstance(v, str):
                  n = v.count(old)
                  count += n
                  return v.replace(old, new)
              if isinstance(v, list):
                  return [walk(x) for x in v]
              if isinstance(v, dict):
                  return {k: walk(x) for k, x in v.items()}
              return v
          d['baseline'] = walk(d['baseline'])
          assert count >= 2, count
          d['checkpoint_revision'] = 50
          assert d['baseline']['version'] == 1
          assert d['runtime'] == runtime_before

          allowed = {'TODO', 'WAITING', 'BLOCKED', 'PASS'}
          for item in d['runtime']['items']:
              assert item['status'] in allowed, item['id']
              if item['status'] == 'PASS':
                  assert 'wait' not in item and 'blocker' not in item, item['id']
              elif item['status'] == 'WAITING':
                  assert item.get('wait', {}).get('condition') and item['wait'].get('resolution_check'), item['id']
                  assert 'blocker' not in item, item['id']
              elif item['status'] == 'BLOCKED':
                  assert item.get('blocker'), item['id']
                  assert 'wait' not in item, item['id']
              else:
                  assert 'wait' not in item and 'blocker' not in item, item['id']

          path.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          reread = json.loads(path.read_text(encoding='utf-8'))
          assert reread == d
          print(f"CHECKPOINT_VALIDATION=PASS revision={d['checkpoint_revision']} baseline={d['baseline']['version']} tasks={len(base)} restored_pass={len(restored)} runtime_unchanged=true")
          PY

          git add CURRENT_STATE.md
          test "$(git diff --cached --name-only)" = 'CURRENT_STATE.md'
          git diff --cached --check
          git commit -m 'state: sync checkpoint after manifest metadata recovery'
          git push origin HEAD:recovery/stability-20260908
          echo "RECOVERY_STABILITY_CANDIDATE=PASS plan_commit=$PLAN_COMMIT checkpoint_commit=$(git rev-parse HEAD) manifest_blob=$MAN_BLOB"
