name: Refresh TSK-0243 fresh WAITING evidence 20260906-0639

on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-tsk0243-waiting-evidence-20260906-0639.yml]

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate current authority and apply minimal WAITING refresh
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'a0099a69858e1ab5d32e6f67f84a7a2ca5e3ca7c'
          test "$(git hash-object CURRENT_STATE.md)" = 'd257000a68d66a7bd9049a2a5f83dd13f3b230a0'
          python3 - <<'PY'
          import copy, json
          from pathlib import Path

          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8')
          before=json.loads(text)
          assert text==json.dumps(before,indent=2,ensure_ascii=False)+'\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==40
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None
          assert before['runtime']['human_constraints']==[]

          work={x['id']:x for x in before['baseline']['work_items']}
          rt={x['id']:x for x in before['runtime']['items']}
          assert len(work)==641 and len(rt)==641 and set(work)==set(rt)
          status={tid:x['status'] for tid,x in rt.items()}
          assert rt['TSK-0243']['status']=='WAITING'
          assert status['TSK-0358']=='PASS'
          assert status['TSK-0452']=='PASS'
          assert status['TSK-0423']=='PASS'
          assert status['TSK-0303']=='PASS'

          expected_condition='Fresh bounded public preflight confirms public application/API routing and verifier wildcard DNS are present, but the deterministic 32-hex challenge host still fails TLS/SNI with alert unrecognized name and its probe endpoint remains unreachable (HTTP 000). TSK-0452 is already PASS, so the remaining TSK-0243 prerequisite is specifically the verifier challenge-host TLS/proxy functional path, not target access or general web deployment.'
          expected_resolution='Rerun the existing bounded read-only TSK-0243 public preflight. Remain WAITING until the deterministic 32-hex challenge hostname both completes trusted TLS/SNI and reaches the approved /api/dns-verification/probes interface while the public application request/result endpoints remain healthy. Only then may separately authorized functional target proof proceed; do not infer DNS/TLS/proxy mutation authority from this WAITING state.'
          assert rt['TSK-0243']['wait']['condition']==expected_condition
          assert rt['TSK-0243']['wait']['resolution_check']==expected_resolution

          def deps_pass(tid):
              return all(status.get(dep)=='PASS' for dep in work[tid]['depends_on'])
          todos=[tid for tid,x in rt.items() if x['status']=='TODO' and deps_pass(tid)]
          todos.sort(key=lambda tid:(work[tid]['plan_priority'] if work[tid]['plan_priority'] is not None else 10**9,work[tid]['order'],tid))
          assert todos==[], todos

          policies={x['id']:x['text'] for x in before['baseline']['policy_rules']}
          assert 'TSK-0455 stays WAITING' in policies['POL-005']
          for tid in ['TSK-0456','TSK-0457','TSK-0492']:
              assert tid in policies['POL-005']
          for tid in ['TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640']:
              assert tid in policies['POL-006']
          for tid in ['TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242']:
              assert tid in policies['POL-007']

          after=copy.deepcopy(before)
          after['checkpoint_revision']=41
          target=next(x for x in after['runtime']['items'] if x['id']=='TSK-0243')
          target['wait']['reference']='Fresh bounded read-only public preflight: workflow run 33900198638, rerun attempt 38, fresh job 101442857179; authority binding PASS; public app HTTP 200, request endpoint HTTP 405, dns.usesafeweb.com DoH probe HTTP 400, verifier wildcard DNS present at 52.157.109.120; deterministic challenge probe remains HTTP 000 and TLS/SNI still fails with alert unrecognized name. Current durable SERIAL LIGHT frontier recomputed from revision 40: eligible TODO count 0; project ACTIVE, governance blocker null, human constraints empty; POL-005/POL-006/POL-007 deferrals remain active. No material-action authority inferred.'

          assert after['baseline']==before['baseline']
          bi={x['id']:x for x in before['runtime']['items']}
          ai={x['id']:x for x in after['runtime']['items']}
          assert set(ai)==set(bi)
          for tid,old in bi.items():
              if tid!='TSK-0243':
                  assert ai[tid]==old,tid
          assert ai['TSK-0243']['status']=='WAITING'
          assert ai['TSK-0243']['wait']['condition']==bi['TSK-0243']['wait']['condition']
          assert ai['TSK-0243']['wait']['resolution_check']==bi['TSK-0243']['wait']['resolution_check']
          assert ai['TSK-0243']['acceptance_references']==bi['TSK-0243']['acceptance_references']
          assert 'next_work' not in after and 'next_work' not in after['runtime']

          p.write_text(json.dumps(after,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('SERIAL_LIGHT_IDENTITY=PASS')
          print('ELIGIBLE_TODO_COUNT=0')
          print('TSK0243_WAITING_EVIDENCE_REFRESH=PASS revision=41')
          PY
          git diff --check -- CURRENT_STATE.md
      - name: Stale-write guard self-remove transport commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = 'd257000a68d66a7bd9049a2a5f83dd13f3b230a0'
          test "$(git rev-parse origin/main^)" = 'a0099a69858e1ab5d32e6f67f84a7a2ca5e3ca7c'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/refresh-tsk0243-waiting-evidence-20260906-0639.yml
          git add CURRENT_STATE.md
          git commit -m 'state: refresh TSK-0243 waiting evidence'
          git push origin HEAD:main
