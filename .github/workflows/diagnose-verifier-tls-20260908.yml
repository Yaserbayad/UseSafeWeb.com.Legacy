# Diagnostic revision: 6
name: Diagnose verifier TLS on AdGuard VM

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-verifier-tls-20260908.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Inspect verifier Nginx structure
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true
          [[ "$(curl -fsS --max-time 5 https://api.ipify.org)" == "52.157.109.120" ]]

          echo '--- NGINX MAIN CONFIG SANITIZED ---'
          sudo sed -n '1,320p' /etc/nginx/nginx.conf \
            | sed -E 's#(ssl_certificate_key[[:space:]]+).*#\1[REDACTED];#'

          echo '--- DEPLOYMENT PREREQUISITES ---'
          printf 'CF_SECRET='; [[ -n "${CF_API_TOKEN:-}" ]] && echo YES || echo NO
          printf 'CF_PLUGIN_PACKAGE='; apt-cache show python3-certbot-dns-cloudflare >/dev/null 2>&1 && echo YES || echo NO
          printf 'CERTBOT_TIMER='; systemctl is-active certbot.timer 2>/dev/null || true
          sudo nginx -t
          echo 'DIAGNOSTIC=PASS'
