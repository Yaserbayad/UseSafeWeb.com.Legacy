# Diagnostic revision: 10
name: Diagnose verifier SNI with reversible Nginx probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-verifier-tls-20260908.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Reproduce verifier SNI and restore Nginx
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true
          [[ "$(curl -fsS --max-time 5 https://api.ipify.org)" == "52.157.109.120" ]]
          systemctl is-active --quiet nginx
          sudo nginx -t

          challenge="0123456789abcdef0123456789abcdef.verify.usesafeweb.com"
          cert_dir="/etc/letsencrypt/live/verify.usesafeweb.com"
          backup="/var/backups/usesafeweb/nginx.conf.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.diag.bak"
          changed=0

          restore() {
            rc=$?
            trap - EXIT
            if (( changed == 1 )); then
              sudo cp -a "${backup}" /etc/nginx/nginx.conf
              sudo nginx -t
              sudo systemctl reload nginx
              echo 'RESTORE=PASS'
            fi
            exit "${rc}"
          }
          trap restore EXIT

          sudo test -r "${cert_dir}/cert.pem"
          sudo test -r "${cert_dir}/chain.pem"
          sudo test -r "${cert_dir}/fullchain.pem"
          sudo test -r "${cert_dir}/privkey.pem"
          ! sudo grep -Fq 'server_name verify.usesafeweb.com *.verify.usesafeweb.com;' /etc/nginx/nginx.conf

          echo '--- CERTIFICATE DIRECT VALIDATION ---'
          sudo openssl x509 -in "${cert_dir}/cert.pem" -noout -subject -issuer -dates -ext subjectAltName
          set +e
          sudo openssl verify \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            -untrusted "${cert_dir}/chain.pem" \
            -verify_hostname "${challenge}" \
            "${cert_dir}/cert.pem"
          cert_verify_rc=$?
          set -e
          echo "CERT_VERIFY_RC=${cert_verify_rc}"

          sudo mkdir -p /var/backups/usesafeweb
          sudo cp -a /etc/nginx/nginx.conf "${backup}"
          changed=1

          sudo python3 - <<'PY'
          from pathlib import Path

          path = Path('/etc/nginx/nginx.conf')
          text = path.read_text()
          marker = "\n}\n\nstream {\n"
          if text.count(marker) != 1:
              raise SystemExit('unexpected nginx http/stream boundary')

          block = r'''
              server {
                  listen 443 ssl http2;
                  server_name verify.usesafeweb.com *.verify.usesafeweb.com;
                  access_log off;
                  error_log /var/log/nginx/usesafeweb-verifier-error.log crit;
                  ssl_certificate /etc/letsencrypt/live/verify.usesafeweb.com/fullchain.pem;
                  ssl_certificate_key /etc/letsencrypt/live/verify.usesafeweb.com/privkey.pem;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_session_tickets off;
                  client_max_body_size 16k;

                  location = /api/dns-verification/probes {
                      limit_except POST { deny all; }
                      proxy_pass https://usesafeweb.com;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-Host $host;
                      proxy_set_header X-Forwarded-Proto https;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header Connection "";
                      proxy_ssl_server_name on;
                      proxy_ssl_name usesafeweb.com;
                      proxy_ssl_verify on;
                      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                      proxy_ssl_verify_depth 3;
                      proxy_connect_timeout 3s;
                      proxy_send_timeout 10s;
                      proxy_read_timeout 10s;
                      proxy_buffering off;
                  }

                  location / { return 404; }
              }
          '''
          path.write_text(text.replace(marker, "\n" + block + "\n}\n\nstream {\n", 1))
          PY

          sudo nginx -t
          sudo systemctl reload nginx
          systemctl is-active --quiet nginx
          echo '--- ACTIVE SERVER NAMES ---'
          sudo nginx -T 2>&1 | grep -E 'server_name (dns|verify)|ssl_certificate /etc/letsencrypt/live/(dns|verify)' || true

          echo '--- TLS AND PROBE MEASUREMENTS ---'
          set +e
          tls_challenge=$(openssl s_client -connect 127.0.0.1:443 -servername "${challenge}" -brief </dev/null 2>&1); tls_challenge_rc=$?
          tls_challenge_verified=$(openssl s_client -connect 127.0.0.1:443 -servername "${challenge}" -verify_return_error -verify_hostname "${challenge}" -brief </dev/null 2>&1); tls_challenge_verified_rc=$?
          tls_apex=$(openssl s_client -connect 127.0.0.1:443 -servername verify.usesafeweb.com -brief </dev/null 2>&1); tls_apex_rc=$?
          tls_dns=$(openssl s_client -connect 127.0.0.1:443 -servername dns.usesafeweb.com -verify_return_error -verify_hostname dns.usesafeweb.com -brief </dev/null 2>&1); tls_dns_rc=$?
          local_probe_insecure=$(curl -ksS --max-time 15 --resolve "${challenge}:443:127.0.0.1" -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://usesafeweb.com' -H 'Content-Type: text/plain' --data 'invalid-probe-token' "https://${challenge}/api/dns-verification/probes"); local_probe_insecure_rc=$?
          local_probe_secure=$(curl -sS --max-time 15 --resolve "${challenge}:443:127.0.0.1" -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://usesafeweb.com' -H 'Content-Type: text/plain' --data 'invalid-probe-token' "https://${challenge}/api/dns-verification/probes"); local_probe_secure_rc=$?
          public_probe_secure=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://usesafeweb.com' -H 'Content-Type: text/plain' --data 'invalid-probe-token' "https://${challenge}/api/dns-verification/probes"); public_probe_secure_rc=$?
          dns_a=$(dig +short "${challenge}" A | tr '\n' ',' | sed 's/,$//'); dns_rc=$?
          set -e

          echo "CERT_VERIFY_RC=${cert_verify_rc}"
          echo "TLS_CHALLENGE_RC=${tls_challenge_rc}"
          printf '%s\n' "${tls_challenge}" | tail -n 8
          echo "TLS_CHALLENGE_VERIFIED_RC=${tls_challenge_verified_rc}"
          printf '%s\n' "${tls_challenge_verified}" | tail -n 8
          echo "TLS_APEX_RC=${tls_apex_rc}"
          printf '%s\n' "${tls_apex}" | tail -n 8
          echo "TLS_DNS_RC=${tls_dns_rc}"
          echo "LOCAL_PROBE_INSECURE_RC=${local_probe_insecure_rc};CODE=${local_probe_insecure}"
          echo "LOCAL_PROBE_SECURE_RC=${local_probe_secure_rc};CODE=${local_probe_secure}"
          echo "PUBLIC_PROBE_SECURE_RC=${public_probe_secure_rc};CODE=${public_probe_secure}"
          echo "DNS_RC=${dns_rc};A=${dns_a}"

          sudo cp -a "${backup}" /etc/nginx/nginx.conf
          sudo nginx -t
          sudo systemctl reload nginx
          changed=0
          trap - EXIT
          echo 'RESTORE=PASS'
          echo 'DIAGNOSTIC=PASS'
