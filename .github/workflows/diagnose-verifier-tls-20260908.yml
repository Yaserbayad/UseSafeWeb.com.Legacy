# Deployment revision: 11
name: Activate verifier TLS proxy on AdGuard VM

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-verifier-tls-20260908.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Activate verifier vhost with rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true
          [[ "$(curl -fsS --max-time 5 https://api.ipify.org)" == "52.157.109.120" ]]
          systemctl is-active --quiet nginx
          systemctl is-active --quiet certbot.timer
          sudo nginx -t

          challenge="0123456789abcdef0123456789abcdef.verify.usesafeweb.com"
          cert_dir="/etc/letsencrypt/live/verify.usesafeweb.com"
          cf_creds="/etc/letsencrypt/cloudflare-usesafeweb.ini"
          renewal="/etc/letsencrypt/renewal/verify.usesafeweb.com.conf"
          backup="/var/backups/usesafeweb/nginx.conf.pre-verifier-vhost.bak"
          changed=0

          rollback() {
            rc=$?
            trap - EXIT
            if (( rc != 0 && changed == 1 )); then
              sudo cp -a "${backup}" /etc/nginx/nginx.conf
              sudo nginx -t
              sudo systemctl reload nginx
              echo 'NGINX_ROLLBACK=PASS'
            fi
            exit "${rc}"
          }
          trap rollback EXIT

          echo '--- PRECHANGE PROOF ---'
          sudo certbot plugins 2>/dev/null | grep -q 'dns-cloudflare'
          sudo test -r "${cert_dir}/cert.pem"
          sudo test -r "${cert_dir}/chain.pem"
          sudo test -r "${cert_dir}/fullchain.pem"
          sudo test -r "${cert_dir}/privkey.pem"
          sudo test -r "${cf_creds}"
          [[ "$(sudo stat -c '%U:%G:%a' "${cf_creds}")" == "root:root:600" ]]
          sudo grep -Fq 'authenticator = dns-cloudflare' "${renewal}"
          sudo grep -Fq "dns_cloudflare_credentials = ${cf_creds}" "${renewal}"
          sudo openssl verify \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            -untrusted "${cert_dir}/chain.pem" \
            -verify_hostname "${challenge}" \
            "${cert_dir}/cert.pem" >/dev/null
          dig +short "${challenge}" A | grep -Fx '52.157.109.120' >/dev/null

          doh_before=$(curl --noproxy '*' -sS --max-time 10 -o /dev/null -w '%{http_code}' https://dns.usesafeweb.com/dns-query)
          web_before=$(curl --noproxy '*' -LsS --max-time 10 -o /dev/null -w '%{http_code}' https://usesafeweb.com/)
          api_before=$(curl --noproxy '*' -sS --max-time 10 -o /dev/null -w '%{http_code}' https://usesafeweb.com/api/dns-verification/requests)
          [[ "${doh_before}" == "400" ]]
          [[ "${web_before}" == "200" ]]
          [[ "${api_before}" == "405" ]]

          sudo mkdir -p /var/backups/usesafeweb
          sudo cp -a /etc/nginx/nginx.conf "${backup}"

          if ! sudo grep -Fq 'server_name verify.usesafeweb.com *.verify.usesafeweb.com;' /etc/nginx/nginx.conf; then
            changed=1
            sudo python3 - <<'PY'
          from pathlib import Path

          path = Path('/etc/nginx/nginx.conf')
          text = path.read_text()
          marker = "\n}\n\nstream {\n"
          if text.count(marker) != 1:
              raise SystemExit('unexpected nginx http/stream boundary')

          block = r'''
              server {
                  listen 443 ssl;
                  server_name verify.usesafeweb.com *.verify.usesafeweb.com;
                  access_log off;
                  error_log /var/log/nginx/usesafeweb-verifier-error.log crit;
                  ssl_certificate /etc/letsencrypt/live/verify.usesafeweb.com/fullchain.pem;
                  ssl_certificate_key /etc/letsencrypt/live/verify.usesafeweb.com/privkey.pem;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_session_tickets off;
                  client_max_body_size 16k;

                  location = /api/dns-verification/probes {
                      limit_except POST { deny all; }
                      proxy_pass https://usesafeweb.com;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-Host $host;
                      proxy_set_header X-Forwarded-Proto https;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header Connection "";
                      proxy_ssl_server_name on;
                      proxy_ssl_name usesafeweb.com;
                      proxy_ssl_verify on;
                      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                      proxy_ssl_verify_depth 3;
                      proxy_connect_timeout 3s;
                      proxy_send_timeout 10s;
                      proxy_read_timeout 10s;
                      proxy_buffering off;
                  }

                  location / { return 404; }
              }
          '''
          path.write_text(text.replace(marker, "\n" + block + "\n}\n\nstream {\n", 1))
          PY
          fi

          sudo nginx -t
          sudo systemctl reload nginx
          systemctl is-active --quiet nginx

          tls_ready=0
          for _ in $(seq 1 40); do
            if openssl s_client -connect 127.0.0.1:443 -servername "${challenge}" -verify_return_error -verify_hostname "${challenge}" -brief </dev/null >/dev/null 2>&1; then
              tls_ready=1
              break
            fi
            sleep 0.25
          done
          [[ "${tls_ready}" == 1 ]]

          probe_code=000
          for _ in $(seq 1 20); do
            probe_code=$(curl --noproxy '*' -sS --max-time 5 --resolve "${challenge}:443:127.0.0.1" -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://usesafeweb.com' -H 'Content-Type: text/plain' --data 'invalid-probe-token' "https://${challenge}/api/dns-verification/probes" || true)
            [[ "${probe_code}" == 403 ]] && break
            sleep 0.25
          done
          [[ "${probe_code}" == 403 ]]

          doh_after=$(curl --noproxy '*' -sS --max-time 10 -o /dev/null -w '%{http_code}' https://dns.usesafeweb.com/dns-query)
          web_after=$(curl --noproxy '*' -LsS --max-time 10 -o /dev/null -w '%{http_code}' https://usesafeweb.com/)
          api_after=$(curl --noproxy '*' -sS --max-time 10 -o /dev/null -w '%{http_code}' https://usesafeweb.com/api/dns-verification/requests)
          [[ "${doh_after}" == "400" ]]
          [[ "${web_after}" == "200" ]]
          [[ "${api_after}" == "405" ]]

          changed=0
          trap - EXIT
          echo "DEPLOYMENT=PASS;TLS=PASS;LOCAL_PROBE=${probe_code};DOH=${doh_after};WEB_FINAL=${web_after};API=${api_after};BACKUP=${backup}"
