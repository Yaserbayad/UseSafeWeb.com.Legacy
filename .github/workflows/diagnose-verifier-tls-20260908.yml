# Diagnostic revision: 8
name: Diagnose verifier deployment preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-verifier-tls-20260908.yml

permissions:
  contents: read

concurrency:
  group: usesafeweb-adguard-server
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Measure exact preflight values
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]
          sudo -n true
          [[ "$(curl -fsS --max-time 5 https://api.ipify.org)" == "52.157.109.120" ]]

          echo "CF_SECRET=$([[ -n "${CF_API_TOKEN:-}" ]] && echo YES || echo NO)"
          systemctl is-active nginx || true
          systemctl is-active certbot.timer || true
          sudo nginx -t || true

          set +e
          openssl s_client -connect 127.0.0.1:443 -servername dns.usesafeweb.com -verify_return_error -brief </dev/null >/dev/null 2>&1
          tls_basic_rc=$?
          openssl s_client -connect 127.0.0.1:443 -servername dns.usesafeweb.com -verify_return_error -verify_hostname dns.usesafeweb.com -brief </dev/null >/dev/null 2>&1
          tls_hostname_rc=$?
          doh_code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://dns.usesafeweb.com/dns-query); doh_rc=$?
          web_code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://usesafeweb.com/); web_rc=$?
          api_code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://usesafeweb.com/api/dns-verification/requests); api_rc=$?
          set -e

          echo "TLS_BASIC_RC=${tls_basic_rc}"
          echo "TLS_HOSTNAME_RC=${tls_hostname_rc}"
          echo "DOH_RC=${doh_rc};DOH_CODE=${doh_code}"
          echo "WEB_RC=${web_rc};WEB_CODE=${web_code}"
          echo "API_RC=${api_rc};API_CODE=${api_code}"
          echo 'DIAGNOSTIC=PASS'
