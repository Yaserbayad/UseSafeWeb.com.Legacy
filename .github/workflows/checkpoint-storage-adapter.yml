name: Checkpoint storage adapter

on:
  push:
    branches:
      - main
    paths:
      - State/checkpoint_request.json
      - .github/workflows/checkpoint-storage-adapter.yml
  workflow_dispatch:

concurrency:
  group: usesafeweb-checkpoint-storage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checkpoint-storage:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Verify bounded runner identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${RUNNER_OS}" == "Linux" ]]
          [[ "${RUNNER_ARCH}" == "X64" ]]
          [[ "$(hostname -s)" == "adguardvm" ]]
          [[ "$(id -un)" == "azureusr" ]]

      - name: Checkout exact request commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute stateless checkpoint adapter
        run: python3 State/tools/checkpoint_storage_adapter_v3.py

      - name: Verify and commit adapter outputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CURRENT_STATE.md State
          if git diff --cached --quiet; then
            echo "CHECKPOINT_ADAPTER_NO_CHANGES"
            exit 0
          fi
          git commit -m "state: apply checkpoint storage request"
          git push origin HEAD:main
