name: TSK-0395 landing acceptance

on:
  push:
    branches:
      - feature/tsk-0395-browser-acceptance-20260903
      - main
    paths:
      - 'website/**'
      - 'Plans/Master/WBS/master-wbs.csv'
      - 'Plans/Master/RELATIONSHIP_INDEX.yaml'
      - 'Plans/Master/Tools/validate_master_plan.py'
      - 'tests/repository-structure/**'
      - '.github/workflows/accept-tsk0395-landing-20260903.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'Plans/Master/WBS/master-wbs.csv'
      - 'Plans/Master/RELATIONSHIP_INDEX.yaml'
      - 'Plans/Master/Tools/validate_master_plan.py'
      - 'tests/repository-structure/**'
      - '.github/workflows/accept-tsk0395-landing-20260903.yml'

permissions:
  contents: read

jobs:
  accept-tsk0395:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify source, governance integrity, and production build
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          cd website
          npm ci --no-fund --no-audit
          npm run format:check
          npm run test:contract
          npm run lint
          npm run typecheck
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          test "$(node -p "require('./node_modules/next/package.json').version")" = '16.3.3'
          test "$(node -p "require('./node_modules/react/package.json').version")" = '19.2.8'
          test "$(node -p "require('./node_modules/react-dom/package.json').version")" = '19.2.8'
          test "$(node -p "require('./node_modules/eslint/package.json').version")" = '9.39.5'
          test "$(node -p "require('./node_modules/prettier/package.json').version")" = '3.9.6'
          cd ..
          python3 tests/repository-structure/verify_structure.py
          python3 Plans/Master/Tools/validate_master_plan.py
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Install exact ephemeral browser acceptance tooling
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm install --no-save --no-package-lock --no-fund --no-audit playwright@1.62.1 axe-core@4.13.0
          test "$(node -p "require('./node_modules/playwright/package.json').version")" = '1.62.1'
          test "$(node -p "require('./node_modules/axe-core/package.json').version")" = '4.13.0'
          npx playwright install --with-deps chromium
      - name: Run real-browser TSK-0395 target acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd website
          NEXT_TELEMETRY_DISABLED=1 npm start -- -p 3000 > /tmp/tsk0395-acceptance.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/tsk0395-acceptance.log' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/en-GB >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/en-GB >/dev/null
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0395-browser.mjs
          BASE_URL=http://127.0.0.1:3000 node tests/browser/tsk0395-screenshots.mjs
          cd ..
          git diff --check
      - name: Upload landing visual acceptance screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tsk0395-landing-screenshots
          path: website/artifacts/tsk0395/*.png
          if-no-files-found: error
          retention-days: 7
