name: TSK-0489 governed CI and promotion gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governed-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Resolve authoritative source SHA
        id: source
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            source_sha="$PR_HEAD_SHA"
          else
            source_sha="$PUSH_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "TSK0489_AUTHORITATIVE_SOURCE_SHA=$source_sha"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove checkout is the authoritative source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo 'TSK0489_CHECKOUT_SOURCE_SHA_BINDING=PASS'
      - name: Prove mismatched source SHA is rejected fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          mismatch='0000000000000000000000000000000000000000'
          set +e
          TSK0489_SOURCE_SHA="$mismatch" bash .github/scripts/tsk0489-governed-ci.sh > /tmp/tsk0489-sha-mismatch.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 87
          grep -Fq 'TSK0489_SOURCE_SHA_BINDING=FAIL' /tmp/tsk0489-sha-mismatch.txt
          grep -Fq 'TSK0489_PROMOTION_ELIGIBLE=NO' /tmp/tsk0489-sha-mismatch.txt
          echo 'TSK0489_SHA_MISMATCH_REJECTION=PASS'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install repository-only proxy syntax checker
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx-core
      - name: Execute the canonical local-equivalent governed gate
        id: gate
        continue-on-error: true
        shell: bash
        env:
          TSK0489_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TSK0490_EXTERNAL_SECRET: ${{ github.token }}
        run: |
          set -o pipefail
          bash .github/scripts/tsk0489-governed-ci.sh 2>&1 | tee /tmp/tsk0489-gate.txt
      - name: Prove deployment and material-action fences remain closed
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/accept-tsk0489-governed-ci-promotion-20260904.yml'
          python3 - "$workflow" <<'PY'
          import json
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          lines = [line.strip() for line in text.splitlines()]
          assert lines.count('contents: read') == 3, lines.count('contents: read')
          assert lines.count('runs-on: ubuntu-24.04') == 2, lines.count('runs-on: ubuntu-24.04')
          assert lines.count('persist-credentials: false') == 1
          for forbidden in ('contents: write', 'deployments: write', 'id-token: write'):
              assert forbidden not in lines, forbidden
          assert not any(line == 'environment:' or line.startswith('environment: ') for line in lines)
          assert not any(line == 'runs-on: self-hosted' or (line.startswith('runs-on: [') and 'self-hosted' in line) for line in lines)
          uses = [line.removeprefix('- uses: ').strip() for line in lines if line.startswith('- uses: ')]
          allowed = {'actions/checkout@v6', 'actions/setup-node@v6', 'actions/upload-artifact@v4'}
          assert uses and set(uses) <= allowed, uses

          decisions = Path('Plans/Master/Registers/DECISIONS_TRIGGERS.md').read_text(encoding='utf-8')
          changes = Path('Plans/Master/Registers/EXCEPTIONS_CHANGE_CONTROLS.md').read_text(encoding='utf-8')
          runtime = json.loads(Path('CURRENT_STATE.md').read_text(encoding='utf-8'))
          assert 'DEC-0060' in decisions
          assert 'Separate genuine human-only, strategic, safety, security, legal, identity, contract, material-spend or irreversible-action boundaries remain unchanged.' in decisions
          assert 'CR-0013' in changes
          assert 'creates no deployment, telemetry activation, participant-facing mutation, production credential/service revocation, payment, activation, launch or other material-action authority.' in changes

          policies = {}
          def walk(node):
              if isinstance(node, dict):
                  if isinstance(node.get('id'), str) and isinstance(node.get('text'), str):
                      policies[node['id']] = node['text']
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(runtime)
          material_fence = policies.get('POL-013', '')
          required = (
              'No deployment',
              'live-device/profile/certificate action',
              'service removal or revocation',
              'participant processing',
              'telemetry activation',
              'production/public activation',
              'geographic/market activation',
              'payment',
              'launch',
              'other fenced material action',
              'require their current independent authority and evidence boundary',
          )
          assert material_fence, 'POL-013'
          for marker in required:
              assert marker in material_fence, marker
          PY
          {
            echo 'TSK0489_DEPLOYMENT_ACTION=NONE'
            echo 'TSK0489_ACTIVATION_ACTION=NONE'
            echo 'TSK0489_PARTICIPANT_ACTION=NONE'
            echo 'TSK0489_SERVICE_MUTATION=NONE'
            echo 'TSK0489_PAYMENT_ACTION=NONE'
            echo 'TSK0489_LAUNCH_ACTION=NONE'
            echo 'TSK0489_MATERIAL_ACTION_FENCES=PASS'
          } | tee -a /tmp/tsk0489-gate.txt
      - name: Capture immutable run evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          touch /tmp/tsk0489-gate.txt
          {
            echo "TSK0489_EVENT=${GITHUB_EVENT_NAME}"
            echo "TSK0489_SOURCE_SHA=${SOURCE_SHA}"
            echo "TSK0489_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
            echo "TSK0489_RUN_ID=${GITHUB_RUN_ID}"
            echo "TSK0489_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "TSK0489_GATE_STEP_OUTCOME=${{ steps.gate.outcome }}"
            echo "TSK0489_GATE_SCRIPT_BLOB=$(git hash-object .github/scripts/tsk0489-governed-ci.sh)"
            echo "TSK0489_WORKFLOW_AUDIT_BLOB=$(git hash-object .github/scripts/verify_tsk0489_workflow_governance.py)"
            echo "TSK0489_WORKFLOW_BLOB=$(git hash-object .github/workflows/accept-tsk0489-governed-ci-promotion-20260904.yml)"
          } >> /tmp/tsk0489-gate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsk-0489-governed-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/tsk0489-gate.txt
          retention-days: 30
      - name: Enforce fail-closed promotion status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ steps.gate.outcome }}' = 'success'
          grep -Fq 'TSK0489_SOURCE_SHA_BINDING=PASS' /tmp/tsk0489-gate.txt
          grep -Fq 'TSK0489_WORKFLOW_GOVERNANCE=PASS' /tmp/tsk0489-gate.txt
          grep -Fq 'TSK0489_PROMOTION_ELIGIBLE=YES' /tmp/tsk0489-gate.txt
          grep -Fq 'TSK0489_MATERIAL_ACTION_FENCES=PASS' /tmp/tsk0489-gate.txt
          echo 'TSK0489_GOVERNED_CI=PASS'

  promotion-eligibility:
    needs: governed-ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Declare exact-source-head governed promotion eligibility
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            source_sha="$PR_HEAD_SHA"
          else
            source_sha="$PUSH_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "TSK0489_PROMOTION_HEAD=$source_sha"
          echo 'TSK0489_PROMOTION_CONDITION=ALL_APPLICABLE_EXACT_HEAD_CHECKS_MUST_PASS'
          echo 'TSK0489_PROMOTION_ELIGIBLE=YES'
          echo 'TSK0489_DEPLOYMENT_AUTHORITY=NONE'
