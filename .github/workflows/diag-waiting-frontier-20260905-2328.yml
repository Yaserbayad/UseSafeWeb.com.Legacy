name: Diagnose SERIAL LIGHT waiting frontier 20260905-2328

on:
  push:
    branches: [main]
    paths: [.github/workflows/diag-waiting-frontier-20260905-2328.yml]

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate authority and compute bounded frontier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "69612452e215723ad71f2dd9ecc7d281e13f5fa8"
          test "$(git hash-object CURRENT_STATE.md)" = "32cf122615b071786be0ad886516127cfe968872"
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path
          d=json.loads(Path('CURRENT_STATE.md').read_text(encoding='utf-8'))
          assert d['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert d['project_id']=='UseSafeWeb.com'
          assert d['governance_mode']=='SERIAL_LIGHT'
          assert d['checkpoint_revision']==34
          assert d['baseline']['version']==1
          assert d['runtime']['project_status']=='ACTIVE'
          assert d['runtime']['governance_blocker'] is None
          assert d['runtime']['human_constraints']==[]
          work={x['id']:x for x in d['baseline']['work_items']}
          rt={x['id']:x for x in d['runtime']['items']}
          assert len(work)==641 and len(rt)==641 and set(work)==set(rt)
          with Path('Plans/Master/WBS/master-wbs.csv').open(encoding='utf-8-sig',newline='') as f:
              wbs={r['Task_ID']:r for r in csv.DictReader(f)}
          status={tid:x['status'] for tid,x in rt.items()}
          def deps_pass(tid): return all(status.get(dep)=='PASS' for dep in work[tid]['depends_on'])
          todos=[tid for tid,x in rt.items() if x['status']=='TODO' and deps_pass(tid)]
          todos.sort(key=lambda tid:(work[tid]['plan_priority'] if work[tid]['plan_priority'] is not None else 10**9,work[tid]['order'],tid))
          # Extract explicit current task-ID mentions from policy rules that describe deferral/waiting/dependency blocking.
          deferrals=set()
          policy_hits=[]
          for p in d['baseline'].get('policy_rules',[]):
              text=p.get('text','')
              low=text.lower()
              if any(k in low for k in ('defer','deferred','stays waiting','remain dependency-blocked','remains dependency-blocked','owner deferral')):
                  ids=sorted(set(re.findall(r'TSK-\d{4}',text)))
                  deferrals.update(ids)
                  if ids: policy_hits.append({'policy':p.get('id'),'ids':ids,'text':text})
          releases=[]
          for tid,x in rt.items():
              if x['status']!='WAITING' or tid in deferrals or not deps_pass(tid): continue
              row=wbs.get(tid,{})
              if row.get('Action_Authority')!='AUTO_ALLOWED': continue
              releases.append(tid)
          releases.sort(key=lambda tid:(work[tid]['plan_priority'] if work[tid]['plan_priority'] is not None else 10**9,work[tid]['order'],tid))
          def detail(tid):
              row=wbs[tid]; b=work[tid]; r=rt[tid]
              return {'id':tid,'status':r['status'],'priority':b['plan_priority'],'order':b['order'],'title':b['title'],'depends_on':b['depends_on'],'gates':b['gates'],'execution_context':b['execution_context'],'action_authority':row.get('Action_Authority'),'trigger':row.get('Trigger'),'preconditions':row.get('Preconditions'),'risk':row.get('Risk_Level') or row.get('Risk')}
          out={'identity':{'schema':d['checkpoint_schema'],'project':d['project_id'],'mode':d['governance_mode'],'revision':d['checkpoint_revision'],'project_status':d['runtime']['project_status']},'eligible_todo_count':len(todos),'eligible_todos':[detail(x) for x in todos[:20]],'explicit_deferral_ids':sorted(deferrals),'deferral_policy_hits':policy_hits,'wait_release_count':len(releases),'wait_release_top20':[detail(x) for x in releases[:20]]}
          print('FRONTIER_JSON_BEGIN')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          print('FRONTIER_JSON_END')
          PY
          test -z "$(git status --porcelain)"
