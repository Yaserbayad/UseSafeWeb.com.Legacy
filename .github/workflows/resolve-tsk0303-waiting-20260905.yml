name: Resolve TSK-0303 WAITING eligibility

on:
  push:
    branches: [main]
    paths: [.github/workflows/resolve-tsk0303-waiting-20260905.yml]

permissions:
  contents: write

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Revalidate and transition WAITING to TODO
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CURRENT_STATE.md)" = '28e866d5cf3fadad087b7de1e11638ed05b52df5'
          test "$(git hash-object brand/guidelines/TSK-0297/README.md)" = 'e79121fd95932a6f4b2550f5f05b84c6e9c7aeac'
          test "$(git hash-object brand/guidelines/TSK-0297/ASSET_MANIFEST.json)" = 'c31eb9674eee9cf330b1af4764088f51e9c398fe'
          test "$(git hash-object brand/system/TSK-0300/tokens.css)" = 'cd7d9a7cd5109e1ff0baa76532495dfd7a27a70f'
          test "$(git hash-object brand/system/TSK-0300/components.css)" = '252da0cb1728073cca08d4ddabcc747793058afe'
          python3 - <<'PY'
          import copy, json
          from pathlib import Path
          p=Path('CURRENT_STATE.md')
          text=p.read_text(encoding='utf-8')
          before=json.loads(text)
          assert text==json.dumps(before,indent=2,ensure_ascii=False)+'\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==32
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None
          assert before['runtime']['human_constraints']==[]
          base={x['id']:x for x in before['baseline']['work_items']}
          rt={x['id']:x for x in before['runtime']['items']}
          assert rt['TSK-0297']['status']=='PASS'
          assert rt['TSK-0051']['status']=='PASS'
          assert base['TSK-0303']['depends_on']==['TSK-0297']
          assert base['TSK-0303']['gates']==[]
          assert base['TSK-0303']['execution_context']=='ACTIVE_ONLY'
          assert base['TSK-0303']['plan_priority']==1
          assert rt['TSK-0303']['status']=='WAITING'
          assert 'TSK-0303' not in {'TSK-0630','TSK-0421','TSK-0415','TSK-0416','TSK-0370','TSK-0499','TSK-0242','TSK-0631','TSK-0633','TSK-0634','TSK-0635','TSK-0637','TSK-0640','TSK-0455'}
          after=copy.deepcopy(before)
          after['checkpoint_revision']=33
          target=next(x for x in after['runtime']['items'] if x['id']=='TSK-0303')
          target.clear(); target.update({'id':'TSK-0303','status':'TODO','acceptance_references':[]})
          assert after['baseline']==before['baseline']
          before_items={x['id']:x for x in before['runtime']['items']}
          after_items={x['id']:x for x in after['runtime']['items']}
          for tid,old in before_items.items():
              if tid!='TSK-0303': assert after_items[tid]==old, tid
          assert after_items['TSK-0303']=={'id':'TSK-0303','status':'TODO','acceptance_references':[]}
          assert 'next_work' not in after and 'next_work' not in after['runtime']
          p.write_text(json.dumps(after,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('TSK0303_WAITING_RESOLVED=TODO revision=33')
          PY
          git diff --check -- CURRENT_STATE.md
      - name: Stale-write guard, remove transport, commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = '28e866d5cf3fadad087b7de1e11638ed05b52df5'
          test "$(git rev-parse origin/main^)" = 'eab65d0c570668d18d8325ed013e78d594d7f463'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/resolve-tsk0303-waiting-20260905.yml
          git add CURRENT_STATE.md
          git commit -m 'state: resolve TSK-0303 waiting to todo'
          git push origin HEAD:main
