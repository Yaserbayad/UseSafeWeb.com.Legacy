name: Record TSK-0303 evidence-backed PASS

on:
  push:
    branches: [main]
    paths: [.github/workflows/pass-tsk0303-20260905.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: usesafeweb-serial-light-checkpoint-write
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact source acceptance and checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '02dc0b8939e784de563443b9668f083d1e35d388'
          test "$(git hash-object CURRENT_STATE.md)" = '4cbc7789badd1c3032c0837cf9967e53938e2622'
          test "$(git hash-object Plans/Master/WBS/master-wbs.csv)" = '357c5e1be3b455e7efddd329d6a2468e3125b502'
          test "$(git hash-object .github/scripts/verify_tsk0303_brand_accessibility_20260905.py)" = 'c9231b8277b17be94d34cf69f7af7c140e60520b'
          test "$(git hash-object .github/workflows/verify-tsk0303-brand-accessibility-20260905.yml)" = '8b77cde0be9b09205809f053f4e28840652f3586'

          acceptance_run="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33996922413)"
          acceptance_jobs="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33996922413/jobs)"
          governed_run="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33996922335)"
          governed_jobs="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33996922335/jobs)"
          python3 - "$acceptance_run" "$acceptance_jobs" "$governed_run" "$governed_jobs" <<'PY'
          import json,sys
          ar,aj,gr,gj=map(json.loads,sys.argv[1:])
          assert ar['head_sha']=='b5621ad17c4938308afdfbff81a6ddbade28b3f5'
          assert ar['event']=='pull_request' and ar['conclusion']=='success'
          jobs={j['name']:j for j in aj['jobs']}
          assert jobs['brand-accessibility']['id']==101388968428
          assert jobs['brand-accessibility']['conclusion']=='success'
          assert gr['head_sha']=='b5621ad17c4938308afdfbff81a6ddbade28b3f5'
          assert gr['event']=='pull_request' and gr['conclusion']=='success'
          jobs={j['name']:j for j in gj['jobs']}
          assert jobs['governed-ci']['id']==101388968271 and jobs['governed-ci']['conclusion']=='success'
          assert jobs['promotion-eligibility']['id']==101389147493 and jobs['promotion-eligibility']['conclusion']=='success'
          print('TSK0303_EXACT_HEAD_ACCEPTANCE=PASS')
          print('TSK0303_GOVERNED_PROMOTION=PASS')
          PY

          mkdir -p /tmp/tsk0303
          python3 .github/scripts/verify_tsk0303_brand_accessibility_20260905.py /tmp/tsk0303/report.json

          python3 - <<'PY'
          import copy,json
          from pathlib import Path
          p=Path('CURRENT_STATE.md'); text=p.read_text(encoding='utf-8'); before=json.loads(text)
          assert text==json.dumps(before,indent=2,ensure_ascii=False)+'\n'
          assert before['checkpoint_schema']=='serial-light-checkpoint-v1'
          assert before['project_id']=='UseSafeWeb.com'
          assert before['governance_mode']=='SERIAL_LIGHT'
          assert before['checkpoint_revision']==33
          assert before['baseline']['version']==1
          assert before['runtime']['project_status']=='ACTIVE'
          assert before['runtime']['governance_blocker'] is None
          assert before['runtime']['human_constraints']==[]
          base={x['id']:x for x in before['baseline']['work_items']}; rt={x['id']:x for x in before['runtime']['items']}
          assert rt['TSK-0303']=={'id':'TSK-0303','status':'TODO','acceptance_references':[]}
          assert rt['TSK-0297']['status']=='PASS'
          assert base['TSK-0303']['depends_on']==['TSK-0297']
          assert base['TSK-0303']['gates']==[]
          assert base['TSK-0303']['acceptance_criteria']==[{'id':'ACC-0303','condition':'Contrast, readability, scaling, focus/error states, imagery/icon meaning, and RTL mirroring rules pass or defects are corrected.'}]

          after=copy.deepcopy(before); after['checkpoint_revision']=34
          target=next(x for x in after['runtime']['items'] if x['id']=='TSK-0303')
          target['status']='PASS'; target['acceptance_references']=[{
            'ac_id':'ACC-0303',
            'evidence_type':'TEST_RESULT',
            'reference':'Yaserbayad/UseSafeWeb.com merged source commit 02dc0b8939e784de563443b9668f083d1e35d388 from exact tested PR head b5621ad17c4938308afdfbff81a6ddbade28b3f5; verifier blob c9231b8277b17be94d34cf69f7af7c140e60520b; acceptance workflow blob 8b77cde0be9b09205809f053f4e28840652f3586; GitHub Actions acceptance run 33996922413 job 101388968428 artifact 9978335900; governed promotion run 33996922335 jobs 101388968271 and 101389147493',
            'summary':'ACC-0303 satisfied: automated contrast/asset/semantic checks and representative desktop, mobile and RTL snapshots pass after correcting dark-field contrast, deterministic monochrome treatment and visible brand-name consistency.',
            'verification_context':'Exact-head acceptance run 33996922413 passed with contrast ratios heading/page 10.621, accent/page 8.411, body/page 13.455, inverse/green 10.621 and focus/page 8.411; six desktop plus six mobile context snapshots and one RTL product snapshot were captured. Focus/error states, logo scaling, imagery/icon meaning and RTL brand isolation passed; directional icon mirroring is not applicable because the reference set contains no directional UI icons. Governed CI and promotion eligibility also passed on the exact tested head. No deployment, participant/profile, telemetry, payment, production/public activation, market activation, service removal/revocation or launch action was performed.'
          }]
          assert after['baseline']==before['baseline']
          bi={x['id']:x for x in before['runtime']['items']}; ai={x['id']:x for x in after['runtime']['items']}
          for tid,old in bi.items():
              if tid!='TSK-0303': assert ai[tid]==old,tid
          assert ai['TSK-0303']['status']=='PASS' and len(ai['TSK-0303']['acceptance_references'])==1
          assert 'next_work' not in after and 'next_work' not in after['runtime']
          p.write_text(json.dumps(after,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('TSK0303_PASS_MUTATION=PASS revision=34')
          PY
          git diff --check -- CURRENT_STATE.md

      - name: Stale-write guard remove transport commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main^)" = '02dc0b8939e784de563443b9668f083d1e35d388'
          test "$(git show origin/main:CURRENT_STATE.md | git hash-object --stdin)" = '4cbc7789badd1c3032c0837cf9967e53938e2622'
          test "$(git show origin/main:Plans/Master/WBS/master-wbs.csv | git hash-object --stdin)" = '357c5e1be3b455e7efddd329d6a2468e3125b502'
          test "$(git show origin/main:.github/scripts/verify_tsk0303_brand_accessibility_20260905.py | git hash-object --stdin)" = 'c9231b8277b17be94d34cf69f7af7c140e60520b'
          test "$(git show origin/main:.github/workflows/verify-tsk0303-brand-accessibility-20260905.yml | git hash-object --stdin)" = '8b77cde0be9b09205809f053f4e28840652f3586'
          git config user.name 'UseSafeWeb Governor'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/pass-tsk0303-20260905.yml
          git add CURRENT_STATE.md
          git commit -m 'state: confirm TSK-0303 brand accessibility pass'
          git push origin HEAD:main
