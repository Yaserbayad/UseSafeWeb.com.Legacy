name: Format real public landing 20260909

on:
  push:
    branches:
      - fix/real-public-landing
    paths:
      - 'website/**'
      - '.github/workflows/format-real-public-landing-20260909.yml'

permissions:
  contents: write

concurrency:
  group: format-real-public-landing-20260909
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/real-public-landing
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Apply repository-exact Prettier formatting
        shell: bash
        run: |
          set -euo pipefail
          cd website
          npm ci --no-fund --no-audit
          npx prettier --write \
            tests/browser/tsk0395-browser.mjs \
            tests/browser/tsk0395-screenshots.mjs \
            tests/contract/tsk0395.test.mjs \
            'src/app/[locale]/page.tsx' \
            src/components/landing-page.tsx \
            src/app/globals.css
          npm run format:check
          cd ..
          git diff --check
      - name: Commit formatting-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website
          if git diff --cached --quiet; then
            echo 'FORMAT_NO_CHANGES'
            exit 0
          fi
          git commit -m 'style: apply exact landing formatting'
          git push origin HEAD:fix/real-public-landing
