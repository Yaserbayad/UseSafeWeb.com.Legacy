name: Website web-host Azure self-hosted read-only discovery 20260908

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website-webhost-azure-selfhosted-readonly-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - name: Verify runner and probe Azure managed-identity visibility
        shell: bash
        env:
          TARGET_IP: 20.71.90.212
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          echo 'MODE=READ_ONLY'

          if ! command -v az >/dev/null 2>&1; then
            echo 'AZ_CLI=NOT_INSTALLED'
            exit 3
          fi
          echo 'AZ_CLI=AVAILABLE'

          config_dir="$(mktemp -d)"
          trap 'rm -rf "$config_dir"' EXIT
          export AZURE_CONFIG_DIR="$config_dir"

          if ! az login --identity --allow-no-subscriptions --output none >/dev/null 2>&1; then
            echo 'MANAGED_IDENTITY_LOGIN=UNAVAILABLE'
            exit 4
          fi
          echo 'MANAGED_IDENTITY_LOGIN=PASS'

          mapfile -t subscriptions < <(az account list --query '[?state==`Enabled`].id' -o tsv)
          echo "VISIBLE_SUBSCRIPTIONS=${#subscriptions[@]}"
          [[ "${#subscriptions[@]}" -gt 0 ]] || exit 5

          found=0
          query_denied=0
          for subscription in "${subscriptions[@]}"; do
            az account set --subscription "$subscription" >/dev/null
            if ! match_tsv="$(az network public-ip list --query "[?ipAddress=='${TARGET_IP}'].[name,resourceGroup,ipConfiguration.id]" -o tsv 2>/dev/null)"; then
              query_denied=$((query_denied + 1))
              continue
            fi
            [[ -n "$match_tsv" ]] || continue

            matches="$(printf '%s\n' "$match_tsv" | sed '/^[[:space:]]*$/d' | wc -l)"
            if [[ "$matches" != "1" ]]; then
              echo "MATCH=AMBIGUOUS count=${matches}"
              exit 6
            fi

            IFS=$'\t' read -r pip_name pip_rg ipconfig_id <<<"$match_tsv"
            echo 'MATCH=YES'
            echo "PUBLIC_IP=${TARGET_IP}"
            echo "PUBLIC_IP_RESOURCE=${pip_name}"
            echo "PUBLIC_IP_RESOURCE_GROUP=${pip_rg}"
            found=1

            if [[ -z "${ipconfig_id:-}" ]]; then
              echo 'ATTACHMENT=UNRESOLVED'
              break
            fi

            nic_name="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="networkinterfaces") {print $(i+1); exit}}' <<<"$ipconfig_id")"
            nic_rg="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="resourcegroups") {print $(i+1); exit}}' <<<"$ipconfig_id")"
            [[ -n "$nic_name" && -n "$nic_rg" ]]
            echo "NIC=${nic_name}"
            echo "NIC_RESOURCE_GROUP=${nic_rg}"

            vm_id="$(az network nic show -g "$nic_rg" -n "$nic_name" --query 'virtualMachine.id' -o tsv)"
            if [[ -z "$vm_id" ]]; then
              echo 'VM=UNRESOLVED'
              break
            fi

            vm_name="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="virtualmachines") {print $(i+1); exit}}' <<<"$vm_id")"
            vm_rg="$(awk -F/ '{for(i=1;i<=NF;i++) if(tolower($i)=="resourcegroups") {print $(i+1); exit}}' <<<"$vm_id")"
            [[ -n "$vm_name" && -n "$vm_rg" ]]
            os_type="$(az vm show -g "$vm_rg" -n "$vm_name" --query 'storageProfile.osDisk.osType' -o tsv)"
            power_state="$(az vm get-instance-view -g "$vm_rg" -n "$vm_name" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv)"
            echo "VM=${vm_name}"
            echo "VM_RESOURCE_GROUP=${vm_rg}"
            echo "VM_OS_TYPE=${os_type}"
            echo "VM_POWER_STATE=${power_state:-unknown}"
            echo 'DISCOVERY=PASS'
            break
          done

          echo "SUBSCRIPTION_QUERY_DENIED_COUNT=${query_denied}"
          if [[ "$found" != "1" ]]; then
            echo 'MATCH=NO'
            exit 7
          fi
