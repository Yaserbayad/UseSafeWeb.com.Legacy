name: Website web-host Azure self-hosted read-only discovery 20260908

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/website-webhost-azure-selfhosted-readonly-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - name: Probe Azure control plane without host mutation
        shell: bash
        env:
          TARGET_IP: 20.71.90.212
        run: |
          set -Eeuo pipefail
          [[ "$(hostname -s)" == "adguardvm" ]]
          command -v curl >/dev/null
          command -v python3 >/dev/null
          echo 'MODE=READ_ONLY'
          echo 'CONTROL_PATH=AZURE_IMDS_ARM_REST'

          token_json="$(curl --fail --silent --show-error --max-time 8 -H 'Metadata:true' 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fmanagement.azure.com%2F')" || {
            echo 'MANAGED_IDENTITY_TOKEN=UNAVAILABLE'
            exit 4
          }
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<<"$token_json")"
          unset token_json
          [[ -n "$token" ]] || { echo 'MANAGED_IDENTITY_TOKEN=EMPTY'; exit 5; }
          echo 'MANAGED_IDENTITY_TOKEN=PASS'

          compute_json="$(curl --fail --silent --show-error --max-time 8 -H 'Metadata:true' 'http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01')"
          current_sub="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("subscriptionId", ""))' <<<"$compute_json")"
          unset compute_json
          [[ -n "$current_sub" ]] || { echo 'CURRENT_SUBSCRIPTION=UNAVAILABLE'; exit 6; }
          echo 'CURRENT_SUBSCRIPTION=RESOLVED'

          arm_get() {
            curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer ${token}" -H 'Accept: application/json' "$1"
          }

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$current_sub" >"$tmp/subscriptions"

          if subscriptions_json="$(arm_get 'https://management.azure.com/subscriptions?api-version=2022-12-01' 2>/dev/null)"; then
            SUB_FILE="$tmp/subscriptions" python3 -c 'import json,os,sys; d=json.load(sys.stdin); p=os.environ["SUB_FILE"]; vals=[x.get("subscriptionId") for x in d.get("value",[]) if x.get("subscriptionId")]; f=open(p,"a",encoding="utf-8"); [f.write(v+"\n") for v in vals]; f.close()' <<<"$subscriptions_json"
            echo 'SUBSCRIPTION_ENUMERATION=PASS'
          else
            echo 'SUBSCRIPTION_ENUMERATION=UNAVAILABLE_USING_CURRENT'
          fi
          sort -u "$tmp/subscriptions" -o "$tmp/subscriptions"
          sub_count="$(wc -l <"$tmp/subscriptions" | tr -d ' ')"
          echo "VISIBLE_SUBSCRIPTIONS_COUNT=${sub_count}"

          found=0
          denied=0
          while IFS= read -r sub; do
            [[ -n "$sub" ]] || continue
            url="https://management.azure.com/subscriptions/${sub}/providers/Microsoft.Network/publicIPAddresses?api-version=2025-07-01"
            while [[ -n "$url" ]]; do
              if ! page_json="$(arm_get "$url" 2>/dev/null)"; then
                denied=$((denied + 1))
                break
              fi
              match_count="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for x in d.get("value",[]) if x.get("properties",{}).get("ipAddress")==sys.argv[1]))' "$TARGET_IP" <<<"$page_json")"
              if [[ "$match_count" -gt 1 ]]; then
                echo "MATCH=AMBIGUOUS count=${match_count}"
                exit 7
              fi
              if [[ "$match_count" == "1" ]]; then
                match_json="$(python3 -c 'import json,sys; d=json.load(sys.stdin); m=[x for x in d.get("value",[]) if x.get("properties",{}).get("ipAddress")==sys.argv[1]][0]; print(json.dumps(m,separators=(",",":")))' "$TARGET_IP" <<<"$page_json")"
                found=1
                break 2
              fi
              url="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("nextLink", ""))' <<<"$page_json")"
            done
          done <"$tmp/subscriptions"

          echo "SUBSCRIPTION_QUERY_DENIED_COUNT=${denied}"
          [[ "$found" == "1" ]] || { echo 'MATCH=NO_OR_NOT_VISIBLE'; exit 8; }

          pip_name="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))' <<<"$match_json")"
          pip_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' <<<"$match_json")"
          ipconfig_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("properties",{}).get("ipConfiguration",{}).get("id", ""))' <<<"$match_json")"
          pip_rg="$(python3 -c 'import sys; p=[x for x in sys.argv[1].split("/") if x]; print(p[p.index("resourceGroups")+1] if "resourceGroups" in p else "")' "$pip_id")"
          echo 'MATCH=YES'
          echo "PUBLIC_IP=${TARGET_IP}"
          echo "PUBLIC_IP_RESOURCE=${pip_name}"
          echo "PUBLIC_IP_RESOURCE_GROUP=${pip_rg}"
          [[ -n "$ipconfig_id" ]] || { echo 'ATTACHMENT=UNRESOLVED'; exit 9; }

          nic_id="${ipconfig_id%/ipConfigurations/*}"
          nic_name="$(python3 -c 'import sys; print([x for x in sys.argv[1].split("/") if x][-1])' "$nic_id")"
          nic_rg="$(python3 -c 'import sys; p=[x for x in sys.argv[1].split("/") if x]; print(p[p.index("resourceGroups")+1] if "resourceGroups" in p else "")' "$nic_id")"
          echo "NIC=${nic_name}"
          echo "NIC_RESOURCE_GROUP=${nic_rg}"

          nic_json="$(arm_get "https://management.azure.com${nic_id}?api-version=2025-05-01")"
          vm_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("properties",{}).get("virtualMachine",{}).get("id", ""))' <<<"$nic_json")"
          [[ -n "$vm_id" ]] || { echo 'VM=UNRESOLVED'; exit 10; }
          vm_name="$(python3 -c 'import sys; print([x for x in sys.argv[1].split("/") if x][-1])' "$vm_id")"
          vm_rg="$(python3 -c 'import sys; p=[x for x in sys.argv[1].split("/") if x]; print(p[p.index("resourceGroups")+1] if "resourceGroups" in p else "")' "$vm_id")"

          vm_json="$(arm_get "https://management.azure.com${vm_id}?api-version=2024-07-01")"
          os_type="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("properties",{}).get("storageProfile",{}).get("osDisk",{}).get("osType", "unknown"))' <<<"$vm_json")"
          instance_json="$(arm_get "https://management.azure.com${vm_id}/instanceView?api-version=2024-07-01")"
          power_state="$(python3 -c 'import json,sys; d=json.load(sys.stdin); s=[x.get("displayStatus","") for x in d.get("statuses",[]) if x.get("code","").startswith("PowerState/")]; print(s[0] if s else "unknown")' <<<"$instance_json")"

          echo "VM=${vm_name}"
          echo "VM_RESOURCE_GROUP=${vm_rg}"
          echo "VM_OS_TYPE=${os_type}"
          echo "VM_POWER_STATE=${power_state}"
          echo 'DISCOVERY=PASS'
